[project]
name = "llm-prompt-lab"
version = "0.1.0"
description = "LLM API experimentation framework with evaluation and checkpoint resume"
requires-python = ">=3.10"

[project.scripts]
llm-lab = "src.cli:main"

[tool.poetry]
name = "llm-prompt-lab"
version = "0.1.0"
description = ""
authors = ["Thronne <ithronne@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
pyyaml = "^6.0.3"
pydantic = "^2.13.4"
jinja2 = "^3.1.6"
tqdm = "^4.67.3"
pandas = "^3.0.3"
openai = "^2.38.0"
openpyxl = "^3.1.0"
poetry-core = "^2.4.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
