# 实验配置 — 多 profile 模式
# profiles 节定义多个完整的候选模型配置，通过 --profile 选择。
# 评测（judge）配置在 eval.yaml 中独立维护。

dataset: data/example.xlsx

# ── Profiles ────────────────────────────────────────────────────────
# 每个 profile 包含完整的 candidate 配置和 prompt。
# 非标准 API 参数（如 chat_template_kwargs）放在 extra_body 下，
# SDK 会将其展开到 HTTP 请求体顶层，与标准参数并列。
profiles:
  default:
    candidate:
      provider: ali
      model: deepseek-v4-flash
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key_env: CANDIDATE_OPENAI_API_KEY
      temperature: 0.7
      max_tokens: 1024
    prompt: candidate-prompt.md

  think:
    candidate:
      provider: ali
      model: deepseek-r1
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key_env: CANDIDATE_OPENAI_API_KEY
      temperature: 0.3
      max_tokens: 8192
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
    prompt: candidate-prompt.md

  # 流式调用示例：逐 token 接收，适合长文本生成场景。
  # 额外记录 ttft_ms（首 token 延迟），避免长生成超时。
  default-stream:
    candidate:
      provider: ali
      model: deepseek-v4-flash
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key_env: CANDIDATE_OPENAI_API_KEY
      temperature: 0.7
      max_tokens: 1024
      stream: true
    prompt: candidate-prompt.md

  # 代理调用示例：通过 PROXY_URL 访问 OpenAI 官方 API。
  # use_proxy=true 时自动禁用 SSL 验证，代理地址从 .env 的 PROXY_URL 读取。
  default-proxy:
    candidate:
      provider: ali
      model: deepseek-v4-flash
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key_env: CANDIDATE_OPENAI_API_KEY
      temperature: 0.7
      max_tokens: 1024
      use_proxy: true
    prompt: candidate-prompt.md
