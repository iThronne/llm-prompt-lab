# Prompt 模板定义
# 使用 Jinja2 语法，变量在运行时注入
# 模板变量可以来自：模板自身定义、数据集行的 query 字段、实验参数

templates:
  # 基础助手
  default:
    system_prompt: "You are a helpful AI assistant."

  # 中文专家
  chinese-expert:
    system_prompt: "你是一位资深的中文技术专家，请用专业、准确的中文回答用户问题。"

  # 简洁模式
  concise:
    system_prompt: "Be concise. Answer in 1-2 sentences."

  # 带角色扮演
  teacher:
    system_prompt: "You are a patient teacher explaining concepts to a student. Use simple language and examples."