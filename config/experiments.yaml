# 实验定义
# 每个实验指定：模型 × 模板 × 数据集 × 参数

experiments:
  # 示例实验：用 GPT-4o-mini + 默认模板跑示例数据集
  example:
    model: gpt-4o-mini
    template: default
    dataset: data/example.xlsx
    params:
      temperature: 0.7
      max_tokens: 1024
    # 评测配置 (LLM-as-Judge)
    judge:
      model: gpt-4o-mini         # 用什么模型做评委
      prompt: |
        You are an expert evaluator. Score the following AI response based on:
        1. Accuracy (1-5): Is the answer factually correct?
        2. Completeness (1-5): Does it fully address the question?
        3. Clarity (1-5): Is it well-written and easy to understand?

        Question: {{ query }}
        AI Response: {{ response }}

        Output ONLY a JSON object with the three scores:
        {"accuracy": X, "completeness": X, "clarity": X}
      dimensions: ["accuracy", "completeness", "clarity"]

  # GPT-4o + 中文专家模板
  gpt4o-chinese:
    model: gpt-4o
    template: chinese-expert
    dataset: data/example.xlsx
    params:
      temperature: 0.3
      max_tokens: 2048
    judge:
      model: gpt-4o-mini
      prompt: |
        You are an expert evaluator. Score the following AI response based on:
        1. Accuracy (1-5): Is the answer factually correct?
        2. Completeness (1-5): Does it fully address the question?
        3. Clarity (1-5): Is it well-written and easy to understand?

        Question: {{ query }}
        AI Response: {{ response }}

        Output ONLY a JSON object with the three scores:
        {"accuracy": X, "completeness": X, "clarity": X}
      dimensions: ["accuracy", "completeness", "clarity"]